<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productivity Methodology Engine</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
</head>
<body>
  <div id="app-container">
    <header class="app-header">
      <div class="brand">
        <h1>Productivity Engine</h1>
        <span class="badge">v1.0.0 (Strict SoC)</span>
      </div>
      <nav class="nav-tabs">
        <button class="tab-btn active" data-view="matrix">2x2 Matrix</button>
        <button class="tab-btn" data-view="hierarchy">5-Layer Hierarchy</button>
        <button class="tab-btn" data-view="ingest">Quick Ingest (L5)</button>
        <button class="tab-btn" data-view="epistemic">Epistemic Governance (L1)</button>
        <button class="tab-btn" data-view="qa">Automated QA Audit</button>
      </nav>
    </header>

    <main id="main-view" class="view-content">
      <!-- Dynamic View Injected Here -->
    </main>

    <!-- Modal for Proof-of-Outcome -->
    <div id="proof-modal" class="modal hidden">
      <div class="modal-card">
        <h3>Submit Proof-of-Outcome (Verification Gate)</h3>
        <p>This high-impact task requires empirical evidence before closure.</p>
        <form id="proof-form">
          <input type="hidden" id="proof-task-id">
          <label>Proof Type:
            <select id="proof-type" required>
              <option value="TELEMETRY_LOG">Telemetry Log (Data)</option>
              <option value="AUTOMATED_TEST">Automated Test Run</option>
              <option value="SIGN_OFF">Compliance Sign-off</option>
              <option value="METRIC_THRESHOLD">Metric Threshold Pass</option>
            </select>
          </label>
          <label>Verification Specification:
            <textarea id="proof-spec" required placeholder="Describe how the outcome was physically/logically confirmed..."></textarea>
          </label>
          <label>Evidence URI / URL / Hash:
            <input type="text" id="proof-uri" required placeholder="https://... or sha256:...">
          </label>
          <div class="modal-actions">
            <button type="button" id="modal-cancel-btn">Cancel</button>
            <button type="submit" class="btn-primary">Verify & Close Task</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
