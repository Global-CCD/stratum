<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stratum | Intent-to-Outcome Engine</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <div id="app-container">
    <header class="app-header">
      <div class="brand">
        <h1>Stratum</h1>
        <span class="badge">v2.1.0 (Hardened)</span>
      </div>
      <div class="header-actions">
        <nav class="nav-tabs" aria-label="Navigation">
          <button class="tab-btn active" data-view="matrix">2x2 Matrix</button>
          <button class="tab-btn" data-view="dag">DAG Graph (L4)</button>
          <button class="tab-btn" data-view="sync">E2EE Sync</button>
          <button class="tab-btn" data-view="qa">Adversarial QA Audit</button>
        </nav>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">☀️ Light</button>
      </div>
    </header>

    <main id="main-view" class="view-content" role="main"></main>

    <!-- Proof Modal -->
    <div id="proof-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <h3>Submit Proof-of-Outcome (Verification Gate)</h3>
        <p style="margin: 0.5rem 0 1rem 0; font-size: 0.85rem; color: var(--text-muted);">
          High-impact tasks (&ge; 7.0) require empirical evidence before closure.
        </p>
        <form id="proof-form">
          <input type="hidden" id="proof-task-id">
          <label>Proof Type:
            <select id="proof-type" required>
              <option value="TELEMETRY_LOG">Telemetry Log / Data File</option>
              <option value="AUTOMATED_TEST">Automated Test Verification</option>
              <option value="SIGN_OFF">Compliance Sign-off</option>
              <option value="METRIC_THRESHOLD">Metric Threshold Pass</option>
            </select>
          </label>
          <label>Verification Specification:
            <textarea id="proof-spec" required rows="3" placeholder="Confirm real-world state change..."></textarea>
          </label>
          <label>Evidence URI / Hash:
            <input type="text" id="proof-uri" required placeholder="https://... or sha256:...">
          </label>
          <div class="modal-actions">
            <button type="button" id="modal-cancel-btn" class="tab-btn">Cancel</button>
            <button type="submit" class="btn-primary">Verify &amp; Close Task</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Live Telemetry Status HUD -->
    <footer class="status-hud" role="contentinfo">
      <div class="hud-item"><span id="hud-fps" class="hud-green">● 60 FPS</span></div>
      <div class="hud-item"><span id="hud-storage">Storage: Querying...</span></div>
      <div class="hud-item"><span class="hud-green">E2EE: Web Worker Active</span></div>
      <div class="hud-item"><span class="hud-green">Sync: Multi-Tab Bus Live</span></div>
    </footer>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
